version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - TZ=${TZ:-America/La_Paz}
      - APP_NAME=${APP_NAME:-Sistema de Almacén TOI}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET:-toi_super_secret_local_key_2026}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - DATABASE_URL=${DATABASE_URL:-postgresql://almacen_toi:almacen_secure_password_2026@toi_almacen_db:5432/almacen_toi}
